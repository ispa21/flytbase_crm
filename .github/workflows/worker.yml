name: worker
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency: worker  # the Postgres lease is the real lock; this just avoids piling up
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 290 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/worker"
