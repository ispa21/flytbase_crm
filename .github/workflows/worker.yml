name: worker
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency: worker  # the Postgres lease is the real lock; this just avoids piling up
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call the worker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          curl -fsS -m 290 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/worker"
